<style>
:root{--bg:#f2f4f8;--card:#fff;--tx:#161a20;--mu:#6b7280;--ac:#0f9d7a;--ac2:#38d9a9;--bd:#e6e9ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:linear-gradient(180deg,var(--tint,rgba(0,0,0,0)) 0,rgba(0,0,0,0) 420px),var(--bg);background-repeat:no-repeat}

.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:24px;padding:16px;margin:10px 0;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.mas{line-height:0;cursor:pointer;flex:none}.mas.sleep{opacity:.8}
.hc{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:14px;padding:7px 11px;font-size:13px;font-weight:600}
.wag{animation:wag 1.4s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
.phx{animation:bob 2.6s ease-in-out infinite;display:block}
@keyframes bob{50%{transform:translateY(-4px)}}
.blink{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.flick{transform-box:fill-box;transform-origin:50% 0;animation:flick 1.1s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(.93)}to{transform:scaleY(1.07)}}
.hop .phx{animation:hop 1s ease-out}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.08,.9)}28%{transform:translateY(-26px) scale(.96,1.06) rotate(-5deg)}46%{transform:translateY(0) scale(1.08,.92)}62%{transform:translateY(-20px) scale(.97,1.05) rotate(5deg)}80%{transform:translateY(0) scale(1.05,.95)}90%{transform:translateY(-4px)}}
.hop .wl{animation:flapl .16s ease-in-out 8 alternate}

.row{display:flex;gap:8px;align-items:center;margin:6px 0}

.li:last-child{border-bottom:0}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px}
.hb{background:rgba(255,255,255,.3)}.hb i{background:#fff}
.btn2{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:11px 15px;font-size:15px;font-weight:600}
.printing>*:not(#rp){display:none!important}.printing #rp{position:static!important;overflow:visible!important;background:#fff!important;color:#000!important}.printing .noprint{display:none!important}.printing .li{border-color:#ddd}.printing .mu{color:#444}
.x{background:none;border:0;color:var(--mu);font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bd{border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center;font-size:13px}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:16px;padding:7px 11px;font-size:13px;margin:4px 4px 0 0}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 4px;border-radius:14px;font-size:13px}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:6px}
.cd{position:relative;aspect-ratio:1;border:1px solid var(--bd);border-radius:10px;font-size:13px;display:flex;align-items:center;justify-content:center}
.cd::before{content:'';position:absolute;inset:0;border-radius:9px;background:var(--ac);opacity:var(--a,0)}
.cd span{position:relative}.cd.hoje{outline:2px solid var(--tx)}.cd.fut{opacity:.35}.cd.hi span{color:#fff}
.rg{animation:rg .9s ease-out}@keyframes rg{from{stroke-dashoffset:var(--c)}}
.lg{margin:6px 0;font-size:14px}
.jr2{display:flex;gap:12px;align-items:center;position:relative;min-height:70px}
.jr2::after{content:'';position:absolute;left:23px;top:50%;bottom:-50%;width:4px;margin-left:-2px;border-radius:2px;background:repeating-linear-gradient(var(--bd) 0 6px,transparent 6px 11px);z-index:0}
.jr2.last::after{display:none}
.jr2.sok::after{background:linear-gradient(var(--ac),var(--ac2))}
.jn2{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;background:var(--bg);border:3px solid var(--bd);position:relative;z-index:1}
.jn2.ok{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.jn2.lock{filter:grayscale(1);opacity:.55}
.jn2.me{background:var(--card);border-color:var(--ac);box-shadow:0 0 0 5px var(--tint,rgba(0,0,0,.06));overflow:visible}
.jn2.me .phx{animation:bob 2.2s ease-in-out infinite}
.jr{display:flex;gap:10px;align-items:center;padding:7px 0;position:relative}
.jn{width:16px;height:16px;border-radius:50%;border:3px solid var(--bd);flex:none;background:var(--card)}.jn.ok{background:var(--ac);border-color:var(--ac)}
.jr:not(:last-child)::after{content:'';position:absolute;left:7px;top:28px;bottom:-8px;width:2px;background:var(--bd)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
#cf span{position:absolute;top:-30px;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.8}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;font-size:14px;max-width:90%;text-align:center}
</style></style>
</head>

<script>
function S0(){return {w:[],goal:null,m:[],meals:[],water:{},act:[],inj:[],bp:[],sl:[],cfg:{water:8,waterMl:2000,bottle:1000,steps:8000,kcal:0,prot:0,house:'fenix',theme:'light',mj:false,lang:'',acc:''},prof:{sex:'',age:0,h:0,act:1.375,obj:'perder'},foods:{},wv:2,ob:0,tpl:[],lastExp:'',rec:[],miss:{},free:{},pet:{name:'',days:[],seen:-1}}}
function load(o){var lg=!!o&&!o.wv;S=Object.assign(S0(),o);fix();if(lg){Object.keys(S.water).forEach(function(k){S.water[k]=S.water[k]*250});S.cfg.waterMl=(S.cfg.water||8)*250}}
function fix(){var hadMj=!!(S.cfg&&S.cfg.mj!==undefined);S.cfg=Object.assign(S0().cfg,S.cfg||{});if(!hadMj&&S.inj&&S.inj.length)S.cfg.mj=true;S.pet=Object.assign(S0().pet,S.pet||{});if(!S.pet.days)S.pet.days=[];S.prof=Object.assign(S0().prof,S.prof||{})}
var S=S0();
try{var r0=localStorage.getItem('cp1');if(r0){load(JSON.parse(r0))}}catch(e){}
function store(){try{localStorage.setItem('cp1',JSON.stringify(S))}catch(e){}}
var timer=null;
function $(id){return document.getElementById(id)}
function num(id){var e=$(id);if(!e)return null;var v=parseFloat(String(e.value).replace(',','.'));return isNaN(v)?null:v}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ld(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function td(){return ld(new Date())}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ld(d)}
function dif(a,b){return Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5)}
function fl(ml){return (ml/1000).toFixed(2).replace(/\.?0+$/,'')}
function byd(a){return a.slice().sort(function(p,q){return p.d<q.d?-1:p.d>q.d?1:0})}
var cur=td(),tab=0,lastXp=0;
function wAt(d){var a=byd(S.w),b=a.filter(function(x){return x.d<=d});return b.length?b[b.length-1].kg:(a.length?a[0].kg:70)}
var AT={'Caminhada':3.5,'Corrida':9,'Bicicleta':7,'Musculação':5,'Natação':7,'HIIT':8,'Ioga':2.5,'Outro':4};
function kout(x){var kg=wAt(x.d);if(x.kcal)return x.kcal;if(x.min>0)return Math.round((AT[x.n]||4)*kg*x.min/60);return Math.round((x.steps||0)*0.00057*kg)}

/* ---------- gamificação ---------- */
var HS={fenix:['🔥','Fénix','#d9480f','#f59f00'],dragao:['🐉','Dragão','#2f9e44','#94d82d'],lobo:['🐺','Lobo','#1971c2','#22b8cf'],coruja:['🦉','Coruja','#7048e8','#e599f7']};
var LV=['Aprendiz','Iniciado','Aprendiz de Magia','Feiticeiro','Mestre das Poções','Mago Errante','Mago Sábio','Arquimago','Guardião da Academia','Lenda Viva'];
var SP=['Cada copo de água é um pequeno feitiço de proteção.','Um mago constante vale mais do que um mago rápido.','Hoje a tua varinha são os teus pés: dá mais uns passos.','As poções mais fortes fazem-se com paciência.','Um dia perfeito começa com uma boa decisão.','A magia está nos pequenos hábitos repetidos.','Não precisas de ser perfeito, só de voltar amanhã.','Cada refeição consciente é um ponto para a tua casa.','O sono é o feitiço de recuperação mais antigo.','Um passo de cada vez, até a montanha se rende.','Quem regista, descobre. Quem descobre, domina.','Até os grandes magos tiveram dias lentos.','A tua sequência é uma chama: mantém-na acesa.','Hoje é um bom dia para subir de nível.'];
function lvOf(xp){return Math.floor((1+Math.sqrt(1+0.08*xp))/2)}
function need(n){return 50*n*(n-1)}
function ltitle(n){return LV[Math.min(n,LV.length)-1]}
function spell(){var d=new Date(cur+'T12:00:00');return SP[(d.getDate()+d.getMonth()*3)%SP.length]}
function dayData(d){
  var c=S.cfg,w=S.w.find(function(x){return x.d==d}),cups=S.water[d]||0,
  ac=S.act.filter(function(x){return x.d==d}),steps=ac.reduce(function(a,x){return a+x.steps},0),min=ac.reduce(function(a,x){return a+x.min},0),
  out=ac.reduce(function(a,x){return a+kout(x)},0),worked=ac.some(function(x){return x.min>0||x.kcal>0}),
  ml=S.meals.filter(function(x){return x.d==d}),kc=ml.reduce(function(a,x){return a+x.kcal},0),pr=ml.reduce(function(a,x){return a+(x.prot||0)},0),
  bp=S.bp.some(function(x){return x.d==d}),inj=S.inj.some(function(x){return x.d==d});
  var q=[
    {k:'Pesar-me',x:10,ok:!!w,t:w?w.kg.toFixed(1)+' kg':'por registar'},
    {k:'Água',x:20,ok:cups>=c.waterMl,t:fl(cups)+'/'+fl(c.waterMl)+' L'},
    {k:'Passos',x:25,ok:steps>=c.steps,t:steps+'/'+c.steps},
    {k:'Dieta cumprida',x:30,ok:c.kcal>0&&kc>=c.kcal*0.7&&kc<=c.kcal,t:c.kcal>0?kc+'/'+c.kcal+' kcal':'define a meta de kcal'}];
  var tr={k:'Bónus: treino',x:20,ok:worked,t:worked?(min?min+' min':'registado'):'sem treino'};
  var n=q.filter(function(x){return x.ok}).length;
  return {q:q,tr:tr,n:n,steps:steps,kc:kc,prot:pr,protOk:c.prot>0&&pr>=c.prot*0.9,out:out,xp:q.reduce(function(a,x){return a+(x.ok?x.x:0)},0)+(tr.ok?tr.x:0)+(bp?5:0)+(inj?15:0)+(n>=4?30:0)}}
function alld(){var s={};Object.keys(S.free||{}).forEach(function(d){s[d]=1});S.w.forEach(function(x){s[x.d]=1});Object.keys(S.water).forEach(function(d){s[d]=1});['act','meals','sl','bp','inj'].forEach(function(k){S[k].forEach(function(x){s[x.d]=1})});return Object.keys(s).sort()}
function calc(){
  var ds=alld(),xp=0,days={};
  ds.forEach(function(d){var r=dayData(d);days[d]=r;xp+=r.xp});
  var wsS={},bonus=0;ds.forEach(function(d){wsS[wsOf(d)]=1});
  Object.keys(wsS).forEach(function(ws){chProg(ws).forEach(function(c){if(c.ok)bonus+=50})});xp+=bonus;xp+=((S.pet&&S.pet.days)||[]).length*5;var jy=journey();xp+=jy?jy.n*50:0;
  var t=td(),st=0,d=t;
  if(!(days[d]&&(days[d].n>=2||isFree(d))))d=addDays(t,-1);
  for(var g=0;g<3660;g++){var r=days[d]||(days[d]=dayData(d));if(r.n>=2||isFree(d)){st++;d=addDays(d,-1)}else break}
  var best=0,c=0,pd=null;
  ds.forEach(function(d){if(days[d].n>=2||isFree(d)){c=(pd&&addDays(pd,1)==d)?c+1:1;pd=d;best=Math.max(best,c)}else{pd=null;c=0}});
  return {xp:xp,days:days,st:st,best:best,bonus:bonus,lv:lvOf(xp)}}
function badges(C){
  var w=S.w,f=w.length?w[0].kg:0,l=w.length?w[w.length-1].kg:0,D=Object.keys(C.days).map(function(k){return C.days[k]});
  return [
    ['🌱','Primeiro passo','Regista o primeiro peso',w.length>0],
    ['💧','Sede de mago','Cumpre a meta de água num dia',D.some(function(r){return r.q[1].ok})],
    ['👟','Caminhante','Cumpre a meta de passos num dia',D.some(function(r){return r.q[2].ok})],
    ['🏃','10 mil passos','Faz 10 000 passos num dia',D.some(function(r){return r.steps>=10000})],
    ['🔥','3 dias seguidos','Sequência de 3 dias ativos',C.best>=3],
    ['⭐','Semana mágica','Sequência de 7 dias ativos',C.best>=7],
    ['👑','Mês lendário','Sequência de 30 dias ativos',C.best>=30],
    ['🌟','Dia perfeito','Cumpre as 4 missões num dia',D.some(function(r){return r.n>=4})],
    ['📉','-1 kg','Menos 1 kg desde o início',w.length>1&&f-l>=1],
    ['📉','-5 kg','Menos 5 kg desde o início',w.length>1&&f-l>=5],
    ['🏅','-10 kg','Menos 10 kg desde o início',w.length>1&&f-l>=10],
    ['🎯','Meta alcançada','Chega ao peso-alvo',!!(S.goal&&w.length>1&&(f>S.goal?l<=S.goal:l>=S.goal))],
    ['📜','Diário fiel','Pesa-te em 7 dias diferentes',w.length>=7],
    ['🧙','Nível 5','Chega ao nível 5',C.lv>=5],
    ['🏆','Desafio semanal','Cumpre um desafio semanal',C.bonus>0]]}
function toast(t){var e=$('ts');if(!e)return;e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.opacity=0},2600)}

/* ---------- gravar ---------- */
function save(){
  S.t=Date.now();store();
  var C=calc();
  var dd=dayData(cur),fl2=flagsOf(dd),q0=lastQ[cur],newly=[],nidx=-1;
  if(q0)fl2.forEach(function(v,i){if(v&&!q0[i]){newly.push(NM[i]);if(nidx<0)nidx=i}});
  if(C.xp>lastXp){var ol=lvOf(lastXp);toast(C.lv>ol?'⬆️ Nível '+C.lv+': '+ltitle(C.lv)+'!':newly.length?'✅ '+newly.join(' + ')+': missão cumprida! +'+(C.xp-lastXp)+' XP':'+'+(C.xp-lastXp)+' XP ✨')}
  if(newly.length)pendingCheer=(dd.n>=4&&(lastN[cur]||0)<4)?'Dia perfeito! Estou tão orgulhosa de ti!':CHM[nidx];
  var nn=dayData(cur).n;if((nn>=4&&(lastN[cur]||0)<4)||C.lv>lvOf(lastXp))confetti();
  var nu=ACC.filter(function(a){return a[3](C)}).length;if(S.accN!==undefined&&nu>S.accN)setTimeout(function(){toast('🎁 Novo acessório desbloqueado!')},2600);S.accN=nu;
  lastXp=C.xp;
  clearTimeout(timer);timer=setTimeout(function(){if(tok&&Date.now()<tokExp-60000)sync(false)},1500)}
function del(a,i){S[a].splice(i,1);save();draw()}
function addW(){var k=num('kg');if(!k)return;var bf=num('bf'),mm=num('mm'),o={d:cur,kg:k};if(bf)o.bf=bf;if(mm)o.mm=mm;S.w=S.w.filter(function(x){return x.d!=cur});S.w.push(o);S.w=byd(S.w);save();draw()}
function setGoalV(v){S.goal=v;save();draw();toast('Meta definida: '+v+' kg')}
function idealHelp(l){
  var h=S.prof.h/100;
  if(!h||h<1.2)return '<div class="mu" style="margin-top:8px">💡 Preenche a tua altura na calculadora (em cima) e sugiro um peso ideal.</div>';
  var r2=function(x){return Math.round(x*2)/2},lo=r2(18.5*h*h),hi=r2(24.9*h*h),id=r2(22*h*h),o='<div style="margin-top:10px"><b>Peso ideal sugerido</b>';
  if(l){var b=l/(h*h);o+='<div class="mu">IMC atual '+b.toFixed(1)+(b<18.5?' (abaixo do intervalo saudável)':b<=24.9?' (intervalo saudável)':' (acima do intervalo saudável)')+'</div>'}
  o+='<div class="li"><span>Intervalo saudável (IMC 18,5–24,9)</span><b>'+lo+'–'+hi+' kg</b></div><div class="li"><span>Referência central (IMC 22)</span><b>'+id+' kg</b></div>';

function nz(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function stem(w){if(w.length<4)return w;if(/(oes|aes)$/.test(w))return w.slice(0,-3)+'ao';if(/(res|ses|zes)$/.test(w))return w.slice(0,-2);if(/s$/.test(w))return w.slice(0,-1);return w}
function words(s){return nz(s).split(/[^a-z0-9]+/).filter(Boolean).map(stem)}
function fdbx(){if(!FDX)FDX=FDB.map(function(f){return {pt:f[0],en:f[1],k:f[2],p:f[3],po:f[4],ws:words(f[0]+' '+f[1]+' '+(f[5]||'')),nw:[words(f[0]),words(f[1])]}});return FDX}
function fview(f){var en=lang()=='en';return {n:en?f.en:f.pt,k:f.k,p:f.p,po:f.po.map(function(x){return {n:en?x[1]:x[0],g:x[2]}})}}
function allFoods(){var a=fdbx().map(function(f){return {src:'db',f:f,ws:f.ws,nw:f.nw}});Object.keys(S.foods).forEach(function(k){var u=S.foods[k];a.push({src:'user',key:k,u:u,ws:words(u.n),nw:[words(u.n)]})});return a}
function fsearch(q,lim,loose){
  var qs=words(q);if(!qs.length)return [];var res=[];
  allFoods().forEach(function(it){
    var m=0,sc=0;
    qs.forEach(function(t){var best=-1;it.ws.forEach(function(w,i){if(w==t)best=Math.max(best,10-i*0.05);else if(t.length>=2&&w.indexOf(t)==0)best=Math.max(best,6-i*0.05)});if(best>=0){m++;sc+=best}});
    var need=loose?Math.ceil(qs.length/2):qs.length;
    if(m>=need&&m>0){var bonus=0;(it.nw||[]).forEach(function(w){if(w.length&&w.length==qs.length&&w.every(function(x){return qs.indexOf(x)>=0}))bonus=Math.max(bonus,25);else if(w.length&&qs.indexOf(w[0])>=0)bonus=Math.max(bonus,3)});res.push({it:it,s:sc+bonus-(qs.length-m)*3-it.ws.length*0.02+(it.src=='user'?0.5:0)})}});
  res.sort(function(a,b){return b.s-a.s});return res.slice(0,lim||8).map(function(x){return x.it})}
function sf(){return Object.keys(S.foods).map(function(k){var f=S.foods[k];return {key:k,n:f.n,k:f.k,p:f.p,t:f.t||0}}).sort(function(a,b){return b.t-a.t}).slice(0,8)}

/* pesquisa */
function fsList(){
  var o=FR.map(function(v,i){return '<div class="li" onclick="fsPick('+i+')" style="cursor:pointer"><span>'+esc(v.n)+'</span><span class="mu">'+Math.round(v.k)+' kcal · '+v.p+' g prot. /100 g</span></div>'}).join('');
  return o+'<div style="margin-top:6px"><button class="chip" onclick="fsOff()">🌐 Procurar na Open Food Facts</button><button class="chip" onclick="fsManual()">➕ Adicionar à mão</button></div>'}
function fsHTML(q){
  FR=[];if(!q||q.trim().length<2)return '';
  fsearch(q,8).forEach(function(it){FR.push(it.src=='db'?fview(it.f):{n:it.u.n,k:it.u.k,p:it.u.p,po:[],key:it.key})});
  return fsList()}
function fsInput(v){FQ=v;var e=$('fsr');if(e)e.innerHTML=fsHTML(v)}
function fsPick(i){var v=FR[i];if(v)afOpen(v)}
function fsManual(){if(!fsearch(FQ,1).length)missAdd(FQ);afOpen({n:FQ.trim(),k:'',p:'',po:[],key:'custom'})}
function fsOff(){
  var q=FQ.trim();if(q.length<2){toast('Escreve o nome do alimento');return}
  if(!fsearch(q,1).length)missAdd(q);
  toast('A procurar…');
  fetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=8&fields=product_name,brands,nutriments,serving_quantity')
   .then(function(r){return r.json()}).then(function(j){
     var ps=(j.products||[]).filter(function(p){return p.product_name&&p.nutriments&&(p.nutriments['energy-kcal_100g']!=null||p.nutriments['energy_100g']!=null)});
     if(!ps.length){toast('Sem resultados');return}
     ps.forEach(function(p){var nu=p.nutriments,k=nu['energy-kcal_100g'];if(k==null)k=nu['energy_100g']/4.184;var sq=parseFloat(p.serving_quantity)||0;
       FR.push({n:(p.product_name+(p.brands?' ('+String(p.brands).split(',')[0]+')':'')).trim(),k:Math.round(k),p:Math.round((nu['proteins_100g']||0)*10)/10,po:sq?[{n:lang()=='en'?'1 serving':'1 porção',g:sq}]:[],key:''})});
     var e=$('fsr');if(e)e.innerHTML=fsList()})
   .catch(function(){toast('Sem ligação à internet')})}

function afOpen(v){AF={n:v.n,k:v.k,p:v.p,po:v.po||[],mode:(v.po&&v.po.length)?'p':'g',g:'',pi:0,cnt:1,key:v.key||''};FQ='';draw()}

function useFood(i){var f=sf()[i];if(f)afOpen({n:f.n,k:f.k,p:f.p,po:[],key:f.key})}
function afRead(){if(!AF)return;var e=$('fn');if(!e)return;AF.n=e.value;AF.k=num('fk');AF.p=num('fp');if(AF.mode=='p'){AF.cnt=num('fc')||0;var s=$('fpo');AF.pi=s?+s.value:0}else AF.g=num('fg')||''}
function afGrams(){return AF.mode=='p'?(AF.cnt||0)*((AF.po[AF.pi]||{g:0}).g):(+AF.g||0)}
function afTxt(){var g=afGrams();return Math.round((+AF.k||0)*g/100)+' kcal · '+(Math.round((+AF.p||0)*g/10)/10)+' g proteína · ≈ '+Math.round(g)+' g'}
function afUpd(){afRead();var e=$('ft');if(e)e.textContent=afTxt()}
function afMode(m){afRead();AF.mode=m;draw()}
function afSave(){
  afRead();var g=afGrams(),n=(AF.n||'').trim()||'Alimento';
  if(AF.k===null||AF.k===''||!g){toast('Preenche kcal/100 g e a quantidade');return}
  var label=AF.mode=='p'?AF.cnt+' × '+AF.po[AF.pi].n:Math.round(g)+' g';
  if(AF.key)S.foods[AF.key=='custom'?'n:'+n.toLowerCase():AF.key]={n:n,k:AF.k,p:AF.p||0,t:Date.now()};
  S.meals.push({d:cur,n:n+' ('+label+')',kcal:Math.round(AF.k*g/100),prot:Math.round((AF.p||0)*g/10)/10,r:curSlot()});
  AF=null;save();draw()}
function afView(){
  var A=AF,hasP=A.po.length>0,v=function(x){return x===null||x===''||x===undefined?'':x};
  var o='<div class="card"><b>Adicionar alimento</b><div class="row"><input id="fn" placeholder="Nome" value="'+esc(A.n)+'"></div>'
   +'<div class="row"><input id="fk" inputmode="decimal" placeholder="kcal/100 g" value="'+v(A.k)+'" oninput="afUpd()"><input id="fp" inputmode="decimal" placeholder="prot./100 g" value="'+v(A.p)+'" oninput="afUpd()"></div>';
  if(hasP)o+='<div class="seg"><button class="'+(A.mode=='g'?'on':'')+'" onclick="afMode(\'g\')">Gramas</button><button class="'+(A.mode=='p'?'on':'')+'" onclick="afMode(\'p\')">Porções</button></div>';
  if(A.mode=='g')o+='<div class="row"><input id="fg" inputmode="decimal" placeholder="gramas" value="'+v(A.g)+'" oninput="afUpd()"></div>';

  return o+'<div class="big" id="ft">'+afTxt()+'</div><div class="mu">Os valores por 100 g ficam guardados se os escreveres à mão.</div><div class="row"><button class="btn" style="flex:2" onclick="afSave()">Adicionar à refeição</button><button class="x" onclick="AF=null;draw()">Cancelar</button></div></div>'}

  var q=pc.qty==null?1:pc.qty,u=pc.unit;
  if(u=='g'||u=='ml')return q;if(u=='kg'||u=='l')return q*1000;
  var kw={colher:'colher|spoon',colherCha:'cha|tea|colher',chavena:'chavena|cup',copo:'copo|glass',fatia:'fatia|slice',lata:'lata|can',punhado:'punhado|handful',scoop:'scoop'}[u];
  if(kw){var re=new RegExp(kw),hit=v.po.find(function(x){var nm=nz(x.n);return re.test(nm)&&(!(u=='colher'&&pc.sub&&pc.sub!='sopa')||nm.indexOf(pc.sub)>=0)});if(hit)return q*hit.g}
  var key=u=='colher'?(pc.sub=='sobremesa'||pc.sub=='cha'||pc.sub=='cafe'?pc.sub:'colher'):u=='colherCha'?'cha':u;
  if(UG[key])return q*UG[key];

  var v=m.src=='db'?fview(m.f):{n:m.u.n,k:m.u.k,p:m.u.p,po:[]},g=txGrams(v,pc);
  return {n:v.n,g:Math.round(g),k:Math.round(v.k*g/100),p:Math.round(v.p*g/10)/10,k100:v.k,p100:v.p,miss:false}}

var SG=[];
function sugest(d){
  var c=S.cfg;if(!c.kcal&&!c.prot)return '';
  var remK=c.kcal?Math.round(c.kcal-d.kc):null,remP=c.prot?Math.round(c.prot-d.prot):null;
  if((remK!==null&&remK<120)||(remK===null&&remP!==null&&remP<=0))return '';
  var cand=[];
  S.rec.forEach(function(r){var pp=recPer(r);cand.push({n:r.n+' (1 porção)',k:pp.k,p:pp.p})});
  fdbx().forEach(function(f){var v=fview(f);if(!v.po.length||v.k<20)return;var g=v.po[0].g;cand.push({n:v.n+(nz(v.n).indexOf(nz(v.po[0].n))>=0?'':' ('+v.po[0].n+')'),k:Math.round(v.k*g/100),p:Math.round(v.p*g/10)/10})});
  var L=cand.filter(function(x){return (remK===null||x.k<=remK)&&x.p>=8&&x.k>=40});
  L.sort(function(a,b){return (b.p/(b.k+60))-(a.p/(a.k+60))});
  SG=L.slice(0,4);if(!SG.length)return '';
  return '<div class="card"><b>💡 O que posso comer ainda hoje?</b><div class="mu">Restam'+(remK!==null?' '+remK+' kcal':'')+(remP>0?' · '+remP+' g de proteína':'')+'. Sugestões que cabem no que falta:</div>'+SG.map(function(x,i){return '<div class="li"><span>'+esc(x.n)+'</span><span>'+x.k+' kcal · '+x.p+' g <button class="chip" onclick="sugAdd('+i+')">+</button></span></div>'}).join('')+'</div>'}

function lookup(code){
  code=String(code||'').replace(/\D/g,'');if(!code)return;
  var c=S.foods[code];
  if(c){tab=1;afOpen({n:c.n,k:c.k,p:c.p,po:[],key:code});return}
  toast('A procurar produto…');
  var manual=function(msg){toast(msg);tab=1;afOpen({n:'',k:'',p:'',po:[],key:'custom'})};
  fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands,nutriments,serving_quantity')
   .then(function(r){return r.json()}).then(function(j){
     if(j.status!==1||!j.product)return manual('Produto não encontrado. Preenche à mão.');
     var p=j.product,nu=p.nutriments||{},k=nu['energy-kcal_100g'];
     if(k==null&&nu['energy_100g']!=null)k=nu['energy_100g']/4.184;
     var pr=nu['proteins_100g'],nm=(p.product_name||'')+(p.brands?' ('+String(p.brands).split(',')[0]+')':'');
     var sq=parseFloat(p.serving_quantity)||0;tab=1;afOpen({n:nm.trim(),k:k==null?'':Math.round(k),p:pr==null?'':Math.round(pr*10)/10,po:sq?[{n:lang()=='en'?'1 serving':'1 porção',g:sq}]:[],key:code});toast('Encontrado: indica a quantidade')})
   .catch(function(){manual('Sem ligação ao serviço. Preenche à mão.')})}

  }catch(e){toast('Scanner indisponível')}}

function adaptive(){
  var c=S.cfg,w=byd(S.w),end=td(),st=addDays(end,-27),ws=w.filter(function(x){return x.d>=st});

function syncRow(){if(window.__PREVIEW)return '';var on=driveOn();return '<div class="row"><span id="st" class="mu" style="flex:1">'+esc(syncMsg||(on?'Toca em Sincronizar para atualizar':'Dados só neste telemóvel'))+'</span><button class="btn" id="sb" onclick="sync(true)">'+(on?'Sincronizar':'Ligar ao Google Drive')+'</button></div>'}
function getTok(){return new Promise(function(res,rej){
  if(!window.google||!google.accounts)return rej(new Error('biblioteca Google não carregou (sem ligação?)'));
  if(!CLIENT_ID)return rej(new Error('o config.js não foi carregado: fecha e volta a abrir a app'));
  if(CLIENT_ID.indexOf('COLOCA')==0)return rej(new Error('o config.js ainda tem o ID de exemplo: fecha e volta a abrir a app'));
  if(!tc)tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
    callback:function(r){if(r.error)return tc._rej(new Error(r.error));tok=r.access_token;tokExp=Date.now()+r.expires_in*1000;try{localStorage.setItem('cp_drive','1')}catch(e){}tc._res(tok)},
    error_callback:function(e){tc._rej(new Error(e.type||'login cancelado'))}});
  tc._res=res;tc._rej=rej;tc.requestAccessToken({prompt:''});
})}
function api(url,o){o=o||{};o.headers=Object.assign({Authorization:'Bearer '+tok},o.headers||{});
  return fetch(url,o).then(function(r){if(!r.ok)throw new Error('Drive '+r.status);return r})}
function findF(){if(fid)return Promise.resolve(fid);
  return api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='"+FN+"'"))
    .then(function(r){return r.json()}).then(function(j){fid=j.files&&j.files[0]?j.files[0].id:null;return fid})}
function push(){var body=JSON.stringify(S);
  if(fid)return api('https://www.googleapis.com/upload/drive/v3/files/'+fid+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:body});
  var b='cpb',meta=JSON.stringify({name:FN,parents:['appDataFolder']});
  return api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},
    body:'--'+b+'\r\nContent-Type: application/json\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--'})
    .then(function(r){return r.json()}).then(function(j){fid=j.id})}
function hasData(o){return !!(o&&((o.w&&o.w.length)||(o.meals&&o.meals.length)||(o.water&&Object.keys(o.water).length)))}
function remember(){try{localStorage.setItem('cp_fid',fid||'')}catch(e){}}
function sync(interactive){
  if(busy)return;busy=true;stat('A sincronizar…');
  var ok=tok&&Date.now()<tokExp-60000,known=null;try{known=localStorage.getItem('cp_fid')}catch(e){}
  (ok?Promise.resolve(tok):(interactive?getTok():Promise.reject(new Error('sem sessão'))))
  .then(findF).then(function(){
    var hasLocal=hasData(S);
    if(!fid){
      if(known&&hasLocal&&!confirm('Parece que entraste com outra conta Google. Queres copiar os dados deste telemóvel para ela?'))throw new Error('cancelado');
      return push().then(remember)}
    return api('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media').then(function(r){return r.json()}).then(function(R){
      var other=known&&known!==fid,first=!known;
      if(hasLocal&&hasData(R)&&(other||first)){
        if(confirm('Esta conta Google já tem dados guardados.\n\nOK = usar os dados da Drive (substitui os deste telemóvel).\nCancelar = manter os deste telemóvel (substitui os da Drive).')){load(R);store();lastXp=calc().xp;draw()}
        else return push().then(remember);
      }else if((R.t||0)>(S.t||0)){load(R);store();lastXp=calc().xp;draw()}
      else if((R.t||0)<(S.t||0))return push();
      remember()})})
  .then(function(){S.lastExp=td();store();stat('Sincronizado às '+new Date().toLocaleTimeString(lang()=='en'?'en-GB':'pt-PT',{hour:'2-digit',minute:'2-digit'}));var b=$('sb');if(b)b.textContent='Sincronizar'})
  .catch(function(e){stat('Sem sincronização: '+e.message)})
  .then(function(){busy=false})}
function driveOff(){
  try{if(tok&&window.google&&google.accounts)google.accounts.oauth2.revoke(tok,function(){})}catch(e){}
  tok=null;tokExp=0;fid=null;tc=null;
  try{localStorage.removeItem('cp_drive');localStorage.removeItem('cp_fid')}catch(e){}
  stat('Dados só neste telemóvel');var b=$('sb');if(b)b.textContent='Ligar ao Google Drive';
  toast('Drive desligada. Os dados continuam neste telemóvel.')}
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
startI18n();
lastXp=calc().xp;
draw();
if(!S.ob){if(S.w.length||Object.keys(S.water).length||S.meals.length)S.ob=1;else obShow()}
</script>
