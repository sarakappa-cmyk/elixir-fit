<script>
function S0(){return {w:[],goal:null,m:[],meals:[],water:{},act:[],inj:[],bp:[],sl:[],cfg:{water:8,waterMl:2000,bottle:1000,steps:8000,kcal:0,prot:0,house:'fenix',theme:'light',mj:false,lang:''},prof:{sex:'',age:0,h:0,act:1.375,obj:'perder'},foods:{},wv:2,ob:0,tpl:[],lastExp:'',pet:{name:'',days:[],seen:-1}}}

var timer=null;
function $(id){return document.getElementById(id)}

function ld(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* ---------- gamificação ---------- */
var HS={fenix:['🔥','Fénix','#d9480f','#f59f00'],dragao:['🐉','Dragão','#2f9e44','#94d82d'],lobo:['🐺','Lobo','#1971c2','#22b8cf'],coruja:['🦉','Coruja','#7048e8','#e599f7']};
var LV=['Aprendiz','Iniciado','Aprendiz de Magia','Feiticeiro','Mestre das Poções','Mago Errante','Mago Sábio','Arquimago','Guardião da Academia','Lenda Viva'];
var SP=['Cada copo de água é um pequeno feitiço de proteção.','Um mago constante vale mais do que um mago rápido.','Hoje a tua varinha são os teus pés: dá mais uns passos.','As poções mais fortes fazem-se com paciência.','Um dia perfeito começa com uma boa decisão.','A magia está nos pequenos hábitos repetidos.','Não precisas de ser perfeito, só de voltar amanhã.','Cada refeição consciente é um ponto para a tua casa.','O sono é o feitiço de recuperação mais antigo.','Um passo de cada vez, até a montanha se rende.','Quem regista, descobre. Quem descobre, domina.','Até os grandes magos tiveram dias lentos.','A tua sequência é uma chama: mantém-na acesa.','Hoje é um bom dia para subir de nível.'];

function ltitle(n){return LV[Math.min(n,LV.length)-1]}
function spell(){var d=new Date(cur+'T12:00:00');return SP[(d.getDate()+d.getMonth()*3)%SP.length]}
function dayData(d){
  var c=S.cfg,w=S.w.find(function(x){return x.d==d}),cups=S.water[d]||0,
  ac=S.act.filter(function(x){return x.d==d}),steps=ac.reduce(function(a,x){return a+x.steps},0),min=ac.reduce(function(a,x){return a+x.min},0),
  out=ac.reduce(function(a,x){return a+kout(x)},0),worked=ac.some(function(x){return x.min>0||x.kcal>0}),
  ml=S.meals.filter(function(x){return x.d==d}),kc=ml.reduce(function(a,x){return a+x.kcal},0),pr=ml.reduce(function(a,x){return a+(x.prot||0)},0),

  var q=[
    {k:'Pesar-me',x:10,ok:!!w,t:w?w.kg.toFixed(1)+' kg':'por registar'},
    {k:'Água',x:20,ok:cups>=c.waterMl,t:fl(cups)+'/'+fl(c.waterMl)+' L'},
    {k:'Passos',x:25,ok:steps>=c.steps,t:steps+'/'+c.steps},
    {k:'Dieta cumprida',x:30,ok:c.kcal>0&&kc>=c.kcal*0.7&&kc<=c.kcal,t:c.kcal>0?kc+'/'+c.kcal+' kcal':'define a meta de kcal'}];

  var n=q.filter(function(x){return x.ok}).length;
  return {q:q,tr:tr,n:n,steps:steps,kc:kc,prot:pr,protOk:c.prot>0&&pr>=c.prot*0.9,out:out,xp:q.reduce(function(a,x){return a+(x.ok?x.x:0)},0)+(tr.ok?tr.x:0)+(bp?5:0)+(inj?15:0)+(n>=4?30:0)}}
function alld(){var s={};S.w.forEach(function(x){s[x.d]=1});Object.keys(S.water).forEach(function(d){s[d]=1});['act','meals','sl','bp','inj'].forEach(function(k){S[k].forEach(function(x){s[x.d]=1})});return Object.keys(s).sort()}
function calc(){
  var ds=alld(),xp=0,days={};
  ds.forEach(function(d){var r=dayData(d);days[d]=r;xp+=r.xp});
  var wsS={},bonus=0;ds.forEach(function(d){wsS[wsOf(d)]=1});
  Object.keys(wsS).forEach(function(ws){chProg(ws).forEach(function(c){if(c.ok)bonus+=50})});xp+=bonus;xp+=((S.pet&&S.pet.days)||[]).length*5;var jy=journey();xp+=jy?jy.n*50:0;
  var t=td(),st=0,d=t;

  return {xp:xp,days:days,st:st,best:best,bonus:bonus,lv:lvOf(xp)}}

function calcX(p,w,goal){

  return {tdee:Math.round(tdee),kc:kc,lo:lo,hi:hi,pt:Math.round((lo+hi)/2),ml:ml,cups:Math.max(1,Math.round(ml/250)),rate:(tdee-kc)*7/7700,note:note,obj:p.obj}}

function lc(ss,suf){
  var all=[].concat.apply([],ss.map(function(s){return s.v}));
  if(all.length<2)return '<p class="mu">Regista pelo menos 2 valores para ver o gráfico.</p>';
  var mn=Math.min.apply(0,all)-1,mx=Math.max.apply(0,all)+1,n=Math.max.apply(0,ss.map(function(s){return s.v.length})),o='<svg viewBox="0 0 320 110" width="100%">';
  ss.forEach(function(s){
    var p=s.v.map(function(v,i){return [10+(n>1?i*300/(n-1):0),100-(v-mn)/(mx-mn)*90]});
    o+='<polyline points="'+p.map(function(a){return a[0].toFixed(1)+','+a[1].toFixed(1)}).join(' ')+'" fill="none" style="stroke:'+s.c+'" stroke-width="2.5"/>';
    if(p.length<=31)p.forEach(function(a){o+='<circle cx="'+a[0].toFixed(1)+'" cy="'+a[1].toFixed(1)+'" r="2.5" style="fill:'+s.c+'"/>'})});

function chOf(ws){var i=Math.floor(dif(ws,'2024-01-01')/7);return [i%8,(i+3)%8,(i+5)%8].map(function(k){return CH[k]})}
function chProg(ws){return chOf(ws).map(function(c){var h=0;for(var i=0;i<7;i++){var d=addDays(ws,i);if(d>td())break;if(c.f(dayData(d)))h++}return {t:c.t,have:h,need:c.need,ok:h>=c.need}})}
function wkStats(end){var r={n:0,wat:0,stp:0,diet:0,prot:0,work:0,steps:0,act:0};for(var i=0;i<7;i++){var x=dayData(addDays(end,-i));r.n+=x.n;r.wat+=x.q[1].ok?1:0;r.stp+=x.q[2].ok?1:0;r.diet+=x.q[3].ok?1:0;r.prot+=x.protOk?1:0;r.work+=x.tr.ok?1:0;r.steps+=x.steps;r.act+=x.n>=2?1:0}r.avg=Math.round(r.steps/7);return r}
function wDelta(end){var a=byd(S.w),f=function(d){var b=a.filter(function(x){return x.d<=d});return b.length?b[b.length-1]:null},x=f(end),y=f(addDays(end,-7));return x&&y&&x!==y?x.kg-y.kg:null}
function movavg(w){return w.map(function(x){var a=w.filter(function(y){var k=dif(x.d,y.d);return k>=0&&k<7});return a.reduce(function(s,y){return s+y.kg},0)/a.length})}
function stall(){
  var w=byd(S.w);if(w.length<3)return null;
  var t=td(),l=w[w.length-1];if(dif(t,l.d)>10)return null;
  var ma=movavg(w),last=ma[ma.length-1],old=null;
  for(var i=w.length-1;i>=0;i--){if(dif(l.d,w[i].d)>=14){old=ma[i];break}}
  if(old===null)return null;
  if(w.filter(function(x){return dif(l.d,x.d)<14}).length<3)return null;
  var losing=S.prof.obj=='perder'||(S.goal&&S.goal<l.kg);if(!losing)return null;
  var dl=last-old;
  if(dl>-0.3)return 'Estagnação: a média do teu peso está estável há 2 semanas ('+(dl>0?'+':'')+dl.toFixed(1)+' kg). É normal acontecer. Antes de mexer na dieta, confirma que registas tudo e vê as medidas (a cintura pode baixar mesmo com o peso parado). Se durar 3 a 4 semanas, fala com o teu médico ou nutricionista.';
  return null}

  var B=badges(C),n=B.filter(function(b){return b[3]}).length;
  return '<div class="card"><b>Nível '+C.lv+' · '+ltitle(C.lv)+'</b><div class="mu">'+C.xp+' XP · sequência atual '+C.st+' dia(s) · melhor '+C.best+'</div></div>'
   +journeyCard(C)+vDesafios()+vWeek()+calCard(C)
   +'<div class="card"><b>Conquistas</b> <span class="mu">'+n+'/'+B.length+'</span><div class="grid">'+B.map(function(b){return '<div class="bd" style="'+(b[3]?'':'opacity:.35;filter:grayscale(1)')+'"><div style="font-size:28px">'+b[0]+'</div><b>'+b[1]+'</b><div class="mu">'+b[2]+'</div></div>'}).join('')+'</div></div>'
   +'<div class="card mu">Um dia conta para a sequência quando cumpres 2 ou mais das 4 missões. A dieta conta quando ficas entre 70% e 100% da tua meta de kcal. O treino é um bónus de XP.</div>'}
function vMetas(){
  var c=S.cfg,p=S.prof,r=calcObj();
  var o='';
  o+='<div class="card"><b>Calculadora do teu objetivo</b><div class="mu">Estimativa de calorias, proteína e água por dia.</div>'
   +'<div class="row"><select id="ps">'+opt([['','Sexo (para a fórmula)'],['m','Masculino'],['f','Feminino']],p.sex)+'</select><input id="pa" inputmode="numeric" placeholder="Idade" value="'+(p.age||'')+'" style="max-width:90px"><input id="ph" inputmode="numeric" placeholder="Altura cm" value="'+(p.h||'')+'" style="max-width:110px"></div>'
   +'<div class="row"><select id="pt">'+opt([[1.2,'Pouco ativo (sem treino)'],[1.375,'Ligeiro (1-3 treinos/sem.)'],[1.55,'Moderado (3-5 treinos/sem.)'],[1.725,'Muito ativo (6-7 treinos/sem.)']],p.act)+'</select></div>'
   +'<div class="row"><select id="po">'+opt([['perder','Objetivo: perder peso'],['manter','Objetivo: manter peso'],['ganhar','Objetivo: ganhar peso']],p.obj)+'</select><button class="btn" onclick="saveProf()">Calcular</button></div>';
  if(r){o+='<div class="li"><span>Gasto diário estimado</span><b>'+r.tdee+' kcal</b></div><div class="li"><span>Para o teu objetivo</span><b>'+r.kc+' kcal/dia</b></div><div class="li"><span>Proteína</span><b>'+r.lo+'–'+r.hi+' g/dia</b></div><div class="li"><span>Líquidos (água incluída)</span><b>≈ '+(r.ml/1000).toFixed(1)+' L por dia</b></div>';
    if(r.obj=='perder')o+='<div class="mu">Ritmo esperado: cerca de '+r.rate.toFixed(2)+' kg/semana.</div>';
    if(r.note)o+='<div class="mu">'+r.note+'</div>';
    o+='<div class="row" style="margin-top:8px"><button class="btn" onclick="applyObj()">Aplicar às minhas metas</button></div>'}
  else o+='<div class="mu">Preenche tudo e regista o teu peso no separador Corpo.</div>';
  o+='<div class="mu" style="margin-top:8px">São estimativas gerais (fórmula Mifflin-St Jeor). Confirma com o teu médico ou nutricionista, sobretudo se tomas medicação ou tens doença renal ou outra condição.</div></div>';
  o+='<div class="card"><b>Metas diárias</b><div class="mu">Água por dia (litros)</div><div class="row"><input id="cw" inputmode="decimal" value="'+(c.waterMl/1000)+'"></div><div class="mu">Passos · kcal · proteína g (0 = sem meta)</div><div class="row"><input id="cs" inputmode="numeric" value="'+c.steps+'"><input id="ck" inputmode="numeric" value="'+c.kcal+'"><input id="cp" inputmode="numeric" value="'+c.prot+'"></div><button class="btn" onclick="saveCfg()">Guardar metas</button></div>';
  var w=byd(S.w),l=w.length?w[w.length-1].kg:null;
  o+='<div class="card"><b>Meta de peso</b><div class="row"><input id="goal" inputmode="decimal" placeholder="kg" value="'+(S.goal||'')+'"><button class="btn" onclick="setGoal()">Definir</button></div>';
  if(S.goal&&l&&w.length){var st=w[0].kg,tot=Math.abs(st-S.goal)||1,done=Math.min(100,Math.max(0,Math.abs(st-l)/tot*100));o+='<div class="bar"><i style="width:'+done.toFixed(0)+'%"></i></div><div class="mu">Faltam '+Math.abs(l-S.goal).toFixed(1)+' kg para '+S.goal+' kg ('+done.toFixed(0)+'%)</div>'}
  o+=idealHelp(l);
  o+='</div>';
  return o}
function vPerfil(){
  var c=S.cfg;
  var o='<div class="card"><b>A tua casa</b><div class="row">'+Object.keys(HS).map(function(k){return '<button class="btn" style="flex:1;background:'+HS[k][2]+';'+(c.house==k?'':'opacity:.4')+'" onclick="setHouse(\''+k+'\')">'+HS[k][0]+'<br><small>'+HS[k][1]+'</small></button>'}).join('')+'</div></div>';
  o+=langCard();
  o+=themeCard();
  o+=treatCard();
  o+='<div class="card"><b>Dados</b>'+syncRow()+'<div class="mu">Guarda uma cópia ou restaura de um ficheiro.</div><div class="row"><button class="btn" onclick="exportar()">Exportar</button><input type="file" accept=".json,application/json" onchange="importar(this)"></div><div class="row"><button class="btn2" style="flex:1" onclick="rpShow()">📄 Relatório para consultas</button></div><div class="row"><button class="btn2" style="flex:1" onclick="obShow()">🧭 Refazer a configuração inicial</button></div><div class="row"><button class="btn2" style="flex:1" onclick="driveOff()">☁️ Desligar da Google Drive</button></div><div style="text-align:center;margin-top:6px"><a href="'+(lang()=='en'?'privacy-en.html':'privacidade.html')+'" target="_blank" class="mu">Política de privacidade</a></div></div>';
  return o}

var MN=['Cintura','Abdómen','Anca'],MC=['#e8590c','#1971c2','#7048e8'];
var TB=[['🏠','Hoje'],['🍽️','Comida'],['⚖️','Corpo'],['🏆','Progresso'],['⚙️','Mais']];
function nav(){$('nav').innerHTML=TB.map(function(t,i){return '<button class="'+(i==tab?'on':'')+'" onclick="tab='+i+';draw()">'+t[0]+'<small>'+t[1]+'</small></button>'}).join('')}
function draw(){
  var C=calc(),h=HS[S.cfg.house]||HS.fenix,st=document.documentElement.style;
  var th=S.cfg.theme||'light',rt=document.documentElement,dk=th=='dark'||(th=='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  if(rt.setAttribute){if(th=='auto')rt.removeAttribute('data-theme');else rt.setAttribute('data-theme',th)}
  st.setProperty('--ac',h[2]);st.setProperty('--ac2',h[3]);st.setProperty('--tint',tint(h[2],dk?0.24:0.18));
  nav();
  var showD=tab<3||(tab==4&&sub<2);
  $('v').innerHTML=(showD?dnav():'')+[vHome,vComida,vPeso,vPremios,vMais][tab](C);
  var dq=dayData(cur);lastN[cur]=dq.n;lastQ[cur]=flagsOf(dq);
  var sg2=stage(C.lv);
  if(S.pet.seen<0)S.pet.seen=sg2;else if(sg2>S.pet.seen){S.pet.seen=sg2;store();showEvo(sg2)}
  if(pendingCheer){var pc=pendingCheer;pendingCheer=null;if(tab==0)happyHop(pc)}
  if(tab==2)phRender()}

/* ---- Google Drive (pasta privada da app) ---- */
var CLIENT_ID=window.CP_CLIENT_ID||'';
var SCOPE='https://www.googleapis.com/auth/drive.appdata',FN='controlo-peso.json';
var tok=null,tokExp=0,tc=null,fid=null,timer=null,busy=false;
var syncMsg='';
function stat(t){syncMsg=t;var e=$('st');if(e)e.textContent=t}
function driveOn(){try{return !!localStorage.getItem('cp_drive')}catch(e){return false}}
function syncRow(){if(window.__PREVIEW)return '';var on=driveOn();return '<div class="row"><span id="st" class="mu" style="flex:1">'+esc(syncMsg||(on?'Toca em Sincronizar para atualizar':'Dados só neste telemóvel'))+'</span><button class="btn" id="sb" onclick="sync(true)">'+(on?'Sincronizar':'Ligar ao Google Drive')+'</button></div>'}
function getTok(){return new Promise(function(res,rej){
  if(!window.google||!google.accounts)return rej(new Error('biblioteca Google não carregou (sem ligação?)'));
  if(!CLIENT_ID)return rej(new Error('o config.js não foi carregado: fecha e volta a abrir a app'));
  if(CLIENT_ID.indexOf('COLOCA')==0)return rej(new Error('o config.js ainda tem o ID de exemplo: fecha e volta a abrir a app'));
  if(!tc)tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
    callback:function(r){if(r.error)return tc._rej(new Error(r.error));tok=r.access_token;tokExp=Date.now()+r.expires_in*1000;try{localStorage.setItem('cp_drive','1')}catch(e){}tc._res(tok)},
    error_callback:function(e){tc._rej(new Error(e.type||'login cancelado'))}});
  tc._res=res;tc._rej=rej;tc.requestAccessToken({prompt:''});
})}
function api(url,o){o=o||{};o.headers=Object.assign({Authorization:'Bearer '+tok},o.headers||{});
  return fetch(url,o).then(function(r){if(!r.ok)throw new Error('Drive '+r.status);return r})}
function findF(){if(fid)return Promise.resolve(fid);
  return api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='"+FN+"'"))
    .then(function(r){return r.json()}).then(function(j){fid=j.files&&j.files[0]?j.files[0].id:null;return fid})}
function push(){var body=JSON.stringify(S);
  if(fid)return api('https://www.googleapis.com/upload/drive/v3/files/'+fid+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:body});
  var b='cpb',meta=JSON.stringify({name:FN,parents:['appDataFolder']});
  return api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},
    body:'--'+b+'\r\nContent-Type: application/json\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--'})
    .then(function(r){return r.json()}).then(function(j){fid=j.id})}
function hasData(o){return !!(o&&((o.w&&o.w.length)||(o.meals&&o.meals.length)||(o.water&&Object.keys(o.water).length)))}
function remember(){try{localStorage.setItem('cp_fid',fid||'')}catch(e){}}
function sync(interactive){
  if(busy)return;busy=true;stat('A sincronizar…');
  var ok=tok&&Date.now()<tokExp-60000,known=null;try{known=localStorage.getItem('cp_fid')}catch(e){}
  (ok?Promise.resolve(tok):(interactive?getTok():Promise.reject(new Error('sem sessão'))))
  .then(findF).then(function(){
    var hasLocal=hasData(S);
    if(!fid){
      if(known&&hasLocal&&!confirm('Parece que entraste com outra conta Google. Queres copiar os dados deste telemóvel para ela?'))throw new Error('cancelado');
      return push().then(remember)}
    return api('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media').then(function(r){return r.json()}).then(function(R){
      var other=known&&known!==fid,first=!known;
      if(hasLocal&&hasData(R)&&(other||first)){
        if(confirm('Esta conta Google já tem dados guardados.\n\nOK = usar os dados da Drive (substitui os deste telemóvel).\nCancelar = manter os deste telemóvel (substitui os da Drive).')){load(R);store();lastXp=calc().xp;draw()}
        else return push().then(remember);
      }else if((R.t||0)>(S.t||0)){load(R);store();lastXp=calc().xp;draw()}
      else if((R.t||0)<(S.t||0))return push();
      remember()})})
  .then(function(){S.lastExp=td();store();stat('Sincronizado às '+new Date().toLocaleTimeString(lang()=='en'?'en-GB':'pt-PT',{hour:'2-digit',minute:'2-digit'}));var b=$('sb');if(b)b.textContent='Sincronizar'})
  .catch(function(e){stat('Sem sincronização: '+e.message)})
  .then(function(){busy=false})}
function driveOff(){
  try{if(tok&&window.google&&google.accounts)google.accounts.oauth2.revoke(tok,function(){})}catch(e){}
  tok=null;tokExp=0;fid=null;tc=null;
  try{localStorage.removeItem('cp_drive');localStorage.removeItem('cp_fid')}catch(e){}
  stat('Dados só neste telemóvel');var b=$('sb');if(b)b.textContent='Ligar ao Google Drive';
  toast('Drive desligada. Os dados continuam neste telemóvel.')}
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
startI18n();
lastXp=calc().xp;
draw();
if(!S.ob){if(S.w.length||Object.keys(S.water).length||S.meals.length)S.ob=1;else obShow()}
</script>
