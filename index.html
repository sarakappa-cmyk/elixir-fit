<script>
function S0(){return {w:[],goal:null,m:[],meals:[],water:{},act:[],inj:[],bp:[],sl:[],cfg:{water:8,waterMl:2000,bottle:1000,steps:8000,kcal:0,prot:0,house:'fenix',theme:'light'},prof:{sex:'',age:0,h:0,act:1.375,obj:'perder'},foods:{},wv:2,ob:0,tpl:[],lastExp:'',pet:{name:'',days:[],seen:-1}}}

try{var r0=localStorage.getItem('cp1');if(r0){load(JSON.parse(r0))}}catch(e){}

var timer=null;
function $(id){return document.getElementById(id)}
function num(id){var e=$(id);if(!e)return null;var v=parseFloat(String(e.value).replace(',','.'));return isNaN(v)?null:v}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ld(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function td(){return ld(new Date())}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ld(d)}
function dif(a,b){return Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5)}
function fl(ml){return (ml/1000).toFixed(2).replace(/\.?0+$/,'')}
function byd(a){return a.slice().sort(function(p,q){return p.d<q.d?-1:p.d>q.d?1:0})}
var cur=td(),tab=0,lastXp=0;

/* ---------- gamificação ---------- */
var HS={fenix:['🔥','Fénix','#d9480f','#f59f00'],dragao:['🐉','Dragão','#2f9e44','#94d82d'],lobo:['🐺','Lobo','#1971c2','#22b8cf'],coruja:['🦉','Coruja','#7048e8','#e599f7']};
var LV=['Aprendiz','Iniciado','Aprendiz de Magia','Feiticeiro','Mestre das Poções','Mago Errante','Mago Sábio','Arquimago','Guardião da Academia','Lenda Viva'];
var SP=['Cada copo de água é um pequeno feitiço de proteção.','Um mago constante vale mais do que um mago rápido.','Hoje a tua varinha são os teus pés: dá mais uns passos.','As poções mais fortes fazem-se com paciência.','Um dia perfeito começa com uma boa decisão.','A magia está nos pequenos hábitos repetidos.','Não precisas de ser perfeito, só de voltar amanhã.','Cada refeição consciente é um ponto para a tua casa.','O sono é o feitiço de recuperação mais antigo.','Um passo de cada vez, até a montanha se rende.','Quem regista, descobre. Quem descobre, domina.','Até os grandes magos tiveram dias lentos.','A tua sequência é uma chama: mantém-na acesa.','Hoje é um bom dia para subir de nível.'];
function lvOf(xp){return Math.floor((1+Math.sqrt(1+0.08*xp))/2)}
function need(n){return 50*n*(n-1)}
function ltitle(n){return LV[Math.min(n,LV.length)-1]}
function spell(){var d=new Date(cur+'T12:00:00');return SP[(d.getDate()+d.getMonth()*3)%SP.length]}
function dayData(d){
  var c=S.cfg,w=S.w.find(function(x){return x.d==d}),cups=S.water[d]||0,
  ac=S.act.filter(function(x){return x.d==d}),steps=ac.reduce(function(a,x){return a+x.steps},0),min=ac.reduce(function(a,x){return a+x.min},0),
  out=ac.reduce(function(a,x){return a+kout(x)},0),worked=ac.some(function(x){return x.min>0||x.kcal>0}),
  ml=S.meals.filter(function(x){return x.d==d}),kc=ml.reduce(function(a,x){return a+x.kcal},0),pr=ml.reduce(function(a,x){return a+(x.prot||0)},0),
  bp=S.bp.some(function(x){return x.d==d}),inj=S.inj.some(function(x){return x.d==d});
  var q=[
    {k:'Pesar-me',x:10,ok:!!w,t:w?w.kg.toFixed(1)+' kg':'por registar'},
    {k:'Água',x:20,ok:cups>=c.waterMl,t:fl(cups)+'/'+fl(c.waterMl)+' L'},
    {k:'Passos',x:25,ok:steps>=c.steps,t:steps+'/'+c.steps},
    {k:'Dieta cumprida',x:30,ok:c.kcal>0&&kc>=c.kcal*0.7&&kc<=c.kcal,t:c.kcal>0?kc+'/'+c.kcal+' kcal':'define a meta de kcal'}];
  var tr={k:'Bónus: treino',x:20,ok:worked,t:worked?(min?min+' min':'registado'):'sem treino'};
  var n=q.filter(function(x){return x.ok}).length;
  return {q:q,tr:tr,n:n,steps:steps,kc:kc,prot:pr,protOk:c.prot>0&&pr>=c.prot*0.9,out:out,xp:q.reduce(function(a,x){return a+(x.ok?x.x:0)},0)+(tr.ok?tr.x:0)+(bp?5:0)+(inj?15:0)+(n>=4?30:0)}}
function alld(){var s={};S.w.forEach(function(x){s[x.d]=1});Object.keys(S.water).forEach(function(d){s[d]=1});['act','meals','sl','bp','inj'].forEach(function(k){S[k].forEach(function(x){s[x.d]=1})});return Object.keys(s).sort()}
function calc(){
  var ds=alld(),xp=0,days={};
  ds.forEach(function(d){var r=dayData(d);days[d]=r;xp+=r.xp});
  var wsS={},bonus=0;ds.forEach(function(d){wsS[wsOf(d)]=1});
  Object.keys(wsS).forEach(function(ws){chProg(ws).forEach(function(c){if(c.ok)bonus+=50})});xp+=bonus;xp+=((S.pet&&S.pet.days)||[]).length*5;var jy=journey();xp+=jy?jy.n*50:0;
  var t=td(),st=0,d=t;
  if(!(days[d]&&days[d].n>=2))d=addDays(t,-1);
  for(var g=0;g<3660;g++){var r=days[d]||(days[d]=dayData(d));if(r.n>=2){st++;d=addDays(d,-1)}else break}
  var best=0,c=0,pd=null;
  ds.forEach(function(d){if(days[d].n>=2){c=(pd&&addDays(pd,1)==d)?c+1:1;pd=d;best=Math.max(best,c)}else{pd=null;c=0}});
  return {xp:xp,days:days,st:st,best:best,bonus:bonus,lv:lvOf(xp)}}
function badges(C){
  var w=S.w,f=w.length?w[0].kg:0,l=w.length?w[w.length-1].kg:0,D=Object.keys(C.days).map(function(k){return C.days[k]});
  return [

    ['🔥','3 dias seguidos','Sequência de 3 dias ativos',C.best>=3],

    ['📉','-1 kg','Menos 1 kg desde o início',w.length>1&&f-l>=1],

    ['🏅','-10 kg','Menos 10 kg desde o início',w.length>1&&f-l>=10],
    ['🎯','Meta alcançada','Chega ao peso-alvo',!!(S.goal&&w.length>1&&(f>S.goal?l<=S.goal:l>=S.goal))],
    ['📜','Diário fiel','Pesa-te em 7 dias diferentes',w.length>=7],

function toast(t){var e=$('ts');if(!e)return;e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.opacity=0},2600)}

/* ---------- gravar ---------- */
function save(){
  S.t=Date.now();store();
  var C=calc();
  var dd=dayData(cur),fl2=flagsOf(dd),q0=lastQ[cur],newly=[],nidx=-1;

function addW(){var k=num('kg');if(!k)return;var bf=num('bf'),mm=num('mm'),o={d:cur,kg:k};if(bf)o.bf=bf;if(mm)o.mm=mm;S.w=S.w.filter(function(x){return x.d!=cur});S.w.push(o);S.w=byd(S.w);save();draw()}

  if(l&&l>hi){var f=r2(l*0.9);if(f>id)o+='<button class="chip" onclick="setGoalV('+f+')">1.º objetivo: −10% ('+f+' kg)</button>'}
  o+='</div><div class="mu">Fica mais fácil por etapas: perder 5–10% do peso já traz benefícios. O IMC é só uma referência, não distingue músculo de gordura; confirma a meta com o teu médico ou nutricionista.</div></div>';
  return o}
function setGoal(){var g=num('goal');if(g){S.goal=g;save();draw()}}

function saveCfg(){var w=num('cw'),b=num('cb'),s=num('cs'),k=num('ck'),p=num('cp');if(w)S.cfg.waterMl=Math.max(250,Math.round(w*1000));if(b)S.cfg.bottle=Math.max(100,Math.round(b));if(s)S.cfg.steps=Math.max(1,Math.round(s));if(k!==null)S.cfg.kcal=Math.max(0,Math.round(k));if(p!==null)S.cfg.prot=Math.max(0,Math.round(p));save();draw();toast('Metas guardadas')}
function calcObj(){var a=byd(S.w);return calcX(S.prof,a.length?a[a.length-1].kg:0,S.goal)}
function calcX(p,w,goal){
  if(!p.sex||!p.age||!p.h||!w)return null;
  var bmr=10*w+6.25*p.h-5*p.age+(p.sex=='m'?5:-161),tdee=bmr*p.act,kc,note='';
  if(p.obj=='perder')kc=tdee-Math.min(tdee*0.2,750);else if(p.obj=='ganhar')kc=tdee*1.1;else kc=tdee;
  var fl=p.sex=='m'?1500:1200;
  if(kc<fl){kc=fl;note='Aplicado o mínimo de segurança de '+fl+' kcal.'}
  kc=Math.round(kc/10)*10;
  var ref=(p.obj=='perder'&&goal&&goal<w)?goal:w,rg=p.obj=='ganhar'?[1.6,2.2]:p.obj=='perder'?[1.6,2.0]:[1.2,1.6],lo=Math.round(ref*rg[0]),hi=Math.round(ref*rg[1]),ml=Math.min(3500,Math.round(w*33/50)*50);
  return {tdee:Math.round(tdee),kc:kc,lo:lo,hi:hi,pt:Math.round((lo+hi)/2),ml:ml,cups:Math.max(1,Math.round(ml/250)),rate:(tdee-kc)*7/7700,note:note,obj:p.obj}}

function flask(p){

  return '<svg viewBox="0 0 60 80" width="64" style="color:var(--tx)"><defs><clipPath id="fc"><path d="'+P+'"/></clipPath></defs><g clip-path="url(#fc)"><rect x="0" y="'+(76-h)+'" width="60" height="'+h+'" style="fill:var(--ac)" opacity=".85"/></g><path d="'+P+'" fill="none" stroke="currentColor" stroke-width="2"/></svg>'}
function lc(ss,suf){
  var all=[].concat.apply([],ss.map(function(s){return s.v}));
  if(all.length<2)return '<p class="mu">Regista pelo menos 2 valores para ver o gráfico.</p>';
  var mn=Math.min.apply(0,all)-1,mx=Math.max.apply(0,all)+1,n=Math.max.apply(0,ss.map(function(s){return s.v.length})),o='<svg viewBox="0 0 320 110" width="100%">';
  ss.forEach(function(s){
    var p=s.v.map(function(v,i){return [10+(n>1?i*300/(n-1):0),100-(v-mn)/(mx-mn)*90]});
    o+='<polyline points="'+p.map(function(a){return a[0].toFixed(1)+','+a[1].toFixed(1)}).join(' ')+'" fill="none" style="stroke:'+s.c+'" stroke-width="2.5"/>';
    if(p.length<=31)p.forEach(function(a){o+='<circle cx="'+a[0].toFixed(1)+'" cy="'+a[1].toFixed(1)+'" r="2.5" style="fill:'+s.c+'"/>'})});
  return o+'</svg><div class="mu">'+mn.toFixed(0)+' – '+mx.toFixed(0)+suf+'</div>'}
function rows(a,f,mx,flt){
  return S[a].map(function(x,i){return [x,i]}).filter(function(p){return !flt||flt(p[0])})
   .sort(function(p,q){return p[0].d<q[0].d?1:p[0].d>q[0].d?-1:q[1]-p[1]}).slice(0,mx||10)
   .map(function(p){var r=f(p[0]);return '<div class="li"><span>'+r[0]+'</span><span>'+r[1]+' <button class="x" onclick="del(\''+a+'\','+p[1]+')">✕</button></span></div>'}).join('')}

  if(!S.w.some(function(x){return x.d==t}))r.push('⚖️ Ainda não registaste o peso hoje.');
  var li=lastInj();

/* ---------- desafios, semana, estagnação ---------- */
var CH=[
 {t:'Proteína: cumpre a meta em 5 dias',need:5,f:function(r){return r.protOk}},
 {t:'Água: cumpre a meta em 6 dias',need:6,f:function(r){return r.q[1].ok}},
 {t:'Passos: cumpre a meta em 5 dias',need:5,f:function(r){return r.q[2].ok}},
 {t:'Treino em 3 dias',need:3,f:function(r){return r.tr.ok}},
 {t:'Pesa-te em 5 dias',need:5,f:function(r){return r.q[0].ok}},
 {t:'Dieta cumprida em 5 dias',need:5,f:function(r){return r.q[3].ok}},
 {t:'2 dias perfeitos (4 missões)',need:2,f:function(r){return r.n>=4}},
 {t:'5 dias ativos (2+ missões)',need:5,f:function(r){return r.n>=2}}];
function wsOf(d){var dt=new Date(d+'T12:00:00');return addDays(d,-((dt.getDay()+6)%7))}
function chOf(ws){var i=Math.floor(dif(ws,'2024-01-01')/7);return [i%8,(i+3)%8,(i+5)%8].map(function(k){return CH[k]})}
function chProg(ws){return chOf(ws).map(function(c){var h=0;for(var i=0;i<7;i++){var d=addDays(ws,i);if(d>td())break;if(c.f(dayData(d)))h++}return {t:c.t,have:h,need:c.need,ok:h>=c.need}})}
function wkStats(end){var r={n:0,wat:0,stp:0,diet:0,prot:0,work:0,steps:0,act:0};for(var i=0;i<7;i++){var x=dayData(addDays(end,-i));r.n+=x.n;r.wat+=x.q[1].ok?1:0;r.stp+=x.q[2].ok?1:0;r.diet+=x.q[3].ok?1:0;r.prot+=x.protOk?1:0;r.work+=x.tr.ok?1:0;r.steps+=x.steps;r.act+=x.n>=2?1:0}r.avg=Math.round(r.steps/7);return r}
function wDelta(end){var a=byd(S.w),f=function(d){var b=a.filter(function(x){return x.d<=d});return b.length?b[b.length-1]:null},x=f(end),y=f(addDays(end,-7));return x&&y&&x!==y?x.kg-y.kg:null}
function movavg(w){return w.map(function(x){var a=w.filter(function(y){var k=dif(x.d,y.d);return k>=0&&k<7});return a.reduce(function(s,y){return s+y.kg},0)/a.length})}
function stall(){
  var w=byd(S.w);if(w.length<3)return null;
  var t=td(),l=w[w.length-1];if(dif(t,l.d)>10)return null;
  var ma=movavg(w),last=ma[ma.length-1],old=null;
  for(var i=w.length-1;i>=0;i--){if(dif(l.d,w[i].d)>=14){old=ma[i];break}}
  if(old===null)return null;
  if(w.filter(function(x){return dif(l.d,x.d)<14}).length<3)return null;
  var losing=S.prof.obj=='perder'||(S.goal&&S.goal<l.kg);if(!losing)return null;
  var dl=last-old;
  if(dl>-0.3)return 'Estagnação: a média do teu peso está estável há 2 semanas ('+(dl>0?'+':'')+dl.toFixed(1)+' kg). É normal acontecer. Antes de mexer na dieta, confirma que registas tudo e vê as medidas (a cintura pode baixar mesmo com o peso parado). Se durar 3 a 4 semanas, fala com o teu médico ou nutricionista.';
  return null}

var FD=null,H5=null;
function sf(){return Object.keys(S.foods).map(function(k){var f=S.foods[k];return {key:k,n:f.n,k:f.k,p:f.p,t:f.t||0}}).sort(function(a,b){return b.t-a.t}).slice(0,8)}
function openFood(){FD={n:'',k:'',p:'',g:'',key:''};draw()}
function useFood(i){var f=sf()[i];if(f){FD={n:f.n,k:f.k,p:f.p,g:'',key:f.key};draw()}}
function updFood(){var k=num('fk'),p=num('fp'),g=num('fg'),e=$('ft');if(!e)return;e.textContent=(k!==null&&g!==null?Math.round(k*g/100):0)+' kcal · '+(p!==null&&g!==null?Math.round(p*g/10)/10:0)+' g proteína'}
function saveFood(){
  var n=$('fn').value.trim()||'Alimento',k=num('fk'),p=num('fp')||0,g=num('fg');
  if(k===null||!g){toast('Preenche kcal/100 g e as gramas');return}
  var key=FD&&FD.key?FD.key:'n:'+n.toLowerCase();
  S.foods[key]={n:n,k:k,p:p,t:Date.now()};
  S.meals.push({d:cur,n:n+' ('+g+' g)',kcal:Math.round(k*g/100),prot:Math.round(p*g/10)/10,r:curSlot()});
  FD=null;save();draw()}
function lookup(code){
  code=String(code||'').replace(/\D/g,'');if(!code)return;
  var c=S.foods[code];
  if(c){FD={n:c.n,k:c.k,p:c.p,g:'',key:code};tab=1;draw();return}
  toast('A procurar produto…');
  var manual=function(msg){toast(msg);FD={n:'',k:'',p:'',g:'',key:code};tab=1;draw()};
  fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands,nutriments,serving_quantity')
   .then(function(r){return r.json()}).then(function(j){
     if(j.status!==1||!j.product)return manual('Produto não encontrado. Preenche à mão.');
     var p=j.product,nu=p.nutriments||{},k=nu['energy-kcal_100g'];
     if(k==null&&nu['energy_100g']!=null)k=nu['energy_100g']/4.184;
     var pr=nu['proteins_100g'],nm=(p.product_name||'')+(p.brands?' ('+String(p.brands).split(',')[0]+')':'');
     FD={n:nm.trim(),k:k==null?'':Math.round(k),p:pr==null?'':Math.round(pr*10)/10,g:parseFloat(p.serving_quantity)||'',key:code};tab=1;draw();toast('Encontrado: indica as gramas')})
   .catch(function(){manual('Sem ligação ao serviço. Preenche à mão.')})}
function scan(){
  if(!window.Html5Qrcode){toast('Scanner indisponível (precisa de ligação à internet)');return}
  $('sc').style.display='block';
  try{
    var F=window.Html5QrcodeSupportedFormats;
    H5=new Html5Qrcode('rd',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],verbose:false});
    H5.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140}},function(t){stopScan();lookup(t)},function(){})
     .catch(function(){stopScan();toast('Sem acesso à câmara. Escreve o código.');$('sc').style.display='block'})
  }catch(e){toast('Scanner indisponível')}}
function stopScan(){$('sc').style.display='none';var h=H5;H5=null;if(h){try{h.stop().then(function(){h.clear()}).catch(function(){})}catch(e){}}}
function vFood(){

   +'<div class="big" id="ft">'+(k!==null&&g!==null?Math.round(k*g/100):0)+' kcal · '+(g!==null&&FD.p!==''?Math.round(FD.p*g/10)/10:0)+' g proteína</div><div class="mu">Pesa o alimento na balança e escreve as gramas. Os valores por 100 g ficam guardados.</div><div class="row"><button class="btn" onclick="saveFood()">Adicionar à refeição</button><button class="x" onclick="FD=null;draw()">Cancelar</button></div></div>'}

/* ---------- fotos de progresso (só no telemóvel) ---------- */
var PH=[],PA=0,PB=-1,DB=null;
function idb(){return new Promise(function(res,rej){if(typeof indexedDB==='undefined')return rej(new Error('sem IDB'));if(DB)return res(DB);var r=indexedDB.open('cpfotos',1);r.onupgradeneeded=function(){r.result.createObjectStore('ph',{keyPath:'id'})};r.onsuccess=function(){DB=r.result;res(DB)};r.onerror=function(){rej(r.error)}})}
function phAll(){return idb().then(function(db){return new Promise(function(res){var q=db.transaction('ph').objectStore('ph').getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}})})}
function phPut(o){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction('ph','readwrite');t.objectStore('ph').put(o);t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function phDel(id){return idb().then(function(db){return new Promise(function(res){var t=db.transaction('ph','readwrite');t.objectStore('ph').delete(id);t.oncomplete=res;t.onerror=res})}).then(phRender)}
function addPh(inp){var f=inp.files[0];if(!f)return;var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);phPut({id:Date.now(),d:cur,data:c.toDataURL('image/jpeg',0.75)}).then(phRender).catch(function(){toast('Não consegui guardar a foto')})};
  im.onerror=function(){toast('Não consegui ler a imagem')};im.src=u}
function phRender(){
  var e=$('phc');if(!e)return;
  phAll().then(function(l){
    PH=l.sort(function(a,b){return a.id-b.id});
    if(PB<0||PB>=PH.length)PB=PH.length-1;if(PA>=PH.length)PA=0;
    var o='<input type="file" accept="image/*" onchange="addPh(this)">';
    if(PH.length>=2){var so=PH.map(function(p,i){return [i,p.d]});
      o+='<div class="row"><select onchange="PA=+this.value;phRender()">'+opt(so,PA)+'</select><select onchange="PB=+this.value;phRender()">'+opt(so,PB)+'</select></div><div class="row"><img src="'+PH[PA].data+'" style="width:50%;border-radius:10px"><img src="'+PH[PB].data+'" style="width:50%;border-radius:10px"></div>'}
    o+='<div class="row" style="flex-wrap:wrap">'+PH.map(function(p){return '<span style="position:relative"><img src="'+p.data+'" style="width:64px;height:64px;object-fit:cover;border-radius:8px"><button class="x" style="position:absolute;top:-6px;right:-6px;background:var(--card);border-radius:50%" onclick="if(confirm(\'Apagar foto?\'))phDel('+p.id+')">✕</button></span>'}).join('')+'</div><div class="mu">As fotos ficam só neste telemóvel (não vão para a Drive nem para a exportação).</div>';
    e.innerHTML=o}).catch(function(){e.textContent='Fotos indisponíveis neste navegador.'})}

/* ---------- calendário ---------- */
var cmo=0,MSN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function pad(n){return String(n).padStart(2,'0')}
function calCard(C){
  var t=new Date(td()+'T12:00:00'),m=new Date(t.getFullYear(),t.getMonth()+cmo,1,12),y=m.getFullYear(),mo=m.getMonth(),off=(m.getDay()+6)%7,nd=new Date(y,mo+1,0).getDate(),act=0;
  var o='<div class="card"><div class="row"><button class="x" onclick="cmo--;draw()">‹</button><b style="flex:1;text-align:center">'+MSN[mo]+' '+y+'</b><button class="x" onclick="if(cmo<0){cmo++;draw()}">›</button></div><div class="cal">'+['S','T','Q','Q','S','S','D'].map(function(x){return '<div class="mu">'+x+'</div>'}).join('');
  for(var i=0;i<off;i++)o+='<div></div>';
  for(var d=1;d<=nd;d++){
    var ds=y+'-'+pad(mo+1)+'-'+pad(d);
    if(ds>td()){o+='<div class="cd fut"><span>'+d+'</span></div>';continue}
    var r=C.days[ds]||dayData(ds),a=r.n>=4?1:r.n>=2?0.7:r.n>=1?0.35:0;if(r.n>=2)act++;
    o+='<div class="cd'+(ds==td()?' hoje':'')+(a>=0.7?' hi':'')+'" style="--a:'+a+'" onclick="cur=\''+ds+'\';tab=0;draw()"><span>'+d+'</span></div>'}
  return o+'</div><div class="mu" style="margin-top:6px">'+act+' dias ativos (2+ missões) neste mês. Toca num dia para o abrir.</div></div>'}
function vWeek(){
  var t=td(),a=wkStats(t),b=wkStats(addDays(t,-7)),dl=wDelta(t);

  o+='<div class="card"><b>Refeições</b> <span class="mu">· '+d.kc+(c.kcal?'/'+c.kcal:'')+' kcal · '+d.prot+(c.prot?'/'+c.prot:'')+' g proteína</span>';
  if(c.kcal)o+='<div class="bar"><i style="width:'+Math.min(100,d.kc/c.kcal*100)+'%"></i></div>';
  if(c.prot)o+='<div class="bar"><i style="width:'+Math.min(100,d.prot/c.prot*100)+'%;background:#e8590c"></i></div>';
  o+='<div>'+SL.map(function(s,i){return '<button class="chip" style="'+(i==r?'background:var(--ac);color:#fff;border-color:var(--ac)':'')+'" onclick="setSlot('+i+')">'+s+'</button>'}).join('')+'</div>';
  o+='<div class="row"><input id="ml" placeholder="O que comeste ('+SL[r].toLowerCase()+')?"></div><div class="row"><input id="kc" inputmode="numeric" placeholder="kcal"><input id="mp" inputmode="numeric" placeholder="prot. (g)"><button class="btn" onclick="addMeal()">+</button></div>';
  o+='<div class="mu" style="margin-top:6px">Atalhos</div><div><button class="chip" onclick="repSlot()">↺ Ontem ('+SL[r]+')</button><button class="chip" onclick="repDay()">↺ Dia de ontem</button></div>';
  if(S.tpl.length)o+='<div class="mu" style="margin-top:6px">Refeições-tipo (toca para adicionar)</div><div>'+S.tpl.map(function(t,i){var k=t.items.reduce(function(a,x){return a+x.kcal},0);return '<span class="chip" style="display:inline-block"><span onclick="useTpl('+i+')">'+esc(t.n)+' · '+k+' kcal</span><button class="x" style="font-size:13px;padding:0 0 0 8px" onclick="delTpl('+i+')">✕</button></span>'}).join('')+'</div>';
  if(fq.length)o+='<div class="mu" style="margin-top:6px">Repetir rápido</div><div>'+fq.map(function(f,i){return '<button class="chip" onclick="quick('+i+')">'+esc(f.n)+' · '+f.kcal+'</button>'}).join('')+'</div>';
  var fm=function(x){return [esc(x.n),x.kcal+' kcal'+(x.prot?' · '+x.prot+' g':'')]};
  SL.concat(['Outras']).forEach(function(s,i){
    var flt=i<4?function(x){return x.d==cur&&x.r===i}:function(x){return x.d==cur&&x.r===undefined},
        L=S.meals.filter(flt);
    if(!L.length)return;
    o+='<div class="mu" style="margin-top:10px"><b>'+s+'</b> · '+L.reduce(function(a,x){return a+x.kcal},0)+' kcal</div>'+rows('meals',fm,30,flt)});
  if(S.meals.some(function(x){return x.d==cur&&x.r===r}))o+='<div class="row" style="margin-top:10px"><input id="tn" placeholder="Nome (ex.: o meu pequeno-almoço)"><button class="btn2" onclick="saveTpl()">Guardar como refeição-tipo</button></div>';
  o+='</div>';
  o+=protHelp(d);
  return o}
function vTreino(){
  var c=S.cfg,d=dayData(cur),mn=S.act.filter(function(x){return x.d==cur}).reduce(function(a,x){return a+x.min},0);
  return '<div class="card"><div class="mu">'+(cur==td()?'Hoje':cur)+'</div><div class="big">'+d.steps+' passos</div><div class="bar"><i style="width:'+Math.min(100,d.steps/c.steps*100)+'%"></i></div><div class="mu">meta '+c.steps+' · '+mn+' min de treino · gasto estimado ≈ '+d.out+' kcal</div></div>'
   +'<div class="card"><div class="row"><select id="at">'+Object.keys(AT).map(function(k){return '<option>'+k+'</option>'}).join('')+'</select><input id="am" inputmode="numeric" placeholder="minutos"></div><div class="row"><input id="as" inputmode="numeric" placeholder="passos"><input id="ak" inputmode="numeric" placeholder="kcal (opcional)"><button class="btn" onclick="addA()">+</button></div>'
   +'<div class="mu">Sem kcal, estimo pelo tipo de treino, duração e o teu peso. Se o relógio ou a app de treino te der as kcal, escreve-as aqui. Só passos (sem minutos) também conta.</div>'
   +rows('act',function(x){return [x.d+' · '+esc(x.n),(x.min?x.min+' min · ':'')+(x.steps?x.steps+' passos · ':'')+kout(x)+' kcal']},10)+'</div>'}
function vSaude(){
  var li=lastInj(),o='<div class="card"><b>Injeções (Mounjaro)</b>';
  if(li){var nx=addDays(li.d,7);o+='<div class="mu">Última há '+dif(td(),li.d)+' dia(s) · '+li.mg+' mg · próxima prevista: '+nx+'</div>'}
  o+='<div class="row"><input id="id" inputmode="decimal" placeholder="Dose (mg)" value="'+(li?li.mg:'')+'" style="max-width:110px"><select id="il"><option>Abdómen</option><option>Coxa</option><option>Braço</option></select></div><div class="row"><input id="ie" placeholder="Efeitos (náuseas, apetite...)"><button class="btn" onclick="addI()">+</button></div>';
  o+=rows('inj',function(x){return [x.d+' · '+x.mg+' mg · '+esc(x.l)+(x.e?'<br><span class="mu">'+esc(x.e)+'</span>':''),'']},8);
  o+='<div class="mu" style="margin-top:8px">Segue sempre a dose e o calendário indicados pelo teu médico.</div></div>';
  var bp=byd(S.bp),r7=bp.slice(-7);
  o+='<div class="card"><b>Tensão arterial</b>';
  if(r7.length){var as=r7.reduce(function(a,x){return a+x.s},0)/r7.length,aa=r7.reduce(function(a,x){return a+x.a},0)/r7.length;o+='<div class="mu">Média dos últimos '+r7.length+' registos: '+as.toFixed(0)+'/'+aa.toFixed(0)+' mmHg</div>'}
  o+='<div class="row"><input id="bs" inputmode="numeric" placeholder="Sist."><input id="bd" inputmode="numeric" placeholder="Diast."><input id="bpl" inputmode="numeric" placeholder="Pulso"><button class="btn" onclick="addBP()">+</button></div>';
  o+=rows('bp',function(x){return [x.d,x.s+'/'+x.a+(x.p?' · '+x.p+' bpm':'')]},8);
  o+='<div class="mu" style="margin-top:8px">Valores muito altos ou sintomas: contacta o teu médico.</div></div>';
  var sl=byd(S.sl);
  o+='<div class="card"><b>Sono, energia e apetite</b><div class="row"><input id="sh" inputmode="decimal" placeholder="Sono (h)"><input id="se" inputmode="numeric" placeholder="Energia 1-5"><input id="sa" inputmode="numeric" placeholder="Apetite 1-5"><button class="btn" onclick="addS()">+</button></div>';
  o+=rows('sl',function(x){return [x.d,x.h+' h · E'+x.e+' · A'+x.a]},8)+'</div>';
  return o}
function vPremios(C){
  var B=badges(C),n=B.filter(function(b){return b[3]}).length;
  return '<div class="card"><b>Nível '+C.lv+' · '+ltitle(C.lv)+'</b><div class="mu">'+C.xp+' XP · sequência atual '+C.st+' dia(s) · melhor '+C.best+'</div></div>'
   +journeyCard(C)+vDesafios()+vWeek()+calCard(C)
   +'<div class="card"><b>Conquistas</b> <span class="mu">'+n+'/'+B.length+'</span><div class="grid">'+B.map(function(b){return '<div class="bd" style="'+(b[3]?'':'opacity:.35;filter:grayscale(1)')+'"><div style="font-size:28px">'+b[0]+'</div><b>'+b[1]+'</b><div class="mu">'+b[2]+'</div></div>'}).join('')+'</div></div>'
   +'<div class="card mu">Um dia conta para a sequência quando cumpres 2 ou mais das 4 missões. A dieta conta quando ficas entre 70% e 100% da tua meta de kcal. O treino é um bónus de XP.</div>'}
function vMetas(){
  var c=S.cfg,p=S.prof,r=calcObj();
  var o='<div class="card"><b>A tua casa</b><div class="row">'+Object.keys(HS).map(function(k){return '<button class="btn" style="flex:1;background:'+HS[k][2]+';'+(c.house==k?'':'opacity:.4')+'" onclick="setHouse(\''+k+'\')">'+HS[k][0]+'<br><small>'+HS[k][1]+'</small></button>'}).join('')+'</div></div>';
  o+=themeCard();
  o+='<div class="card"><b>Calculadora do teu objetivo</b><div class="mu">Estimativa de calorias, proteína e água por dia.</div>'
   +'<div class="row"><select id="ps">'+opt([['','Sexo (para a fórmula)'],['m','Masculino'],['f','Feminino']],p.sex)+'</select><input id="pa" inputmode="numeric" placeholder="Idade" value="'+(p.age||'')+'" style="max-width:90px"><input id="ph" inputmode="numeric" placeholder="Altura cm" value="'+(p.h||'')+'" style="max-width:110px"></div>'
   +'<div class="row"><select id="pt">'+opt([[1.2,'Pouco ativo (sem treino)'],[1.375,'Ligeiro (1-3 treinos/sem.)'],[1.55,'Moderado (3-5 treinos/sem.)'],[1.725,'Muito ativo (6-7 treinos/sem.)']],p.act)+'</select></div>'
   +'<div class="row"><select id="po">'+opt([['perder','Objetivo: perder peso'],['manter','Objetivo: manter peso'],['ganhar','Objetivo: ganhar peso']],p.obj)+'</select><button class="btn" onclick="saveProf()">Calcular</button></div>';
  if(r){o+='<div class="li"><span>Gasto diário estimado</span><b>'+r.tdee+' kcal</b></div><div class="li"><span>Para o teu objetivo</span><b>'+r.kc+' kcal/dia</b></div><div class="li"><span>Proteína</span><b>'+r.lo+'–'+r.hi+' g/dia</b></div><div class="li"><span>Líquidos (água incluída)</span><b>≈ '+(r.ml/1000).toFixed(1)+' L por dia</b></div>';
    if(r.obj=='perder')o+='<div class="mu">Ritmo esperado: cerca de '+r.rate.toFixed(2)+' kg/semana.</div>';
    if(r.note)o+='<div class="mu">'+r.note+'</div>';
    o+='<div class="row" style="margin-top:8px"><button class="btn" onclick="applyObj()">Aplicar às minhas metas</button></div>'}
  else o+='<div class="mu">Preenche tudo e regista o teu peso no separador Corpo.</div>';
  o+='<div class="mu" style="margin-top:8px">São estimativas gerais (fórmula Mifflin-St Jeor). Confirma com o teu médico ou nutricionista, sobretudo se tomas medicação ou tens doença renal ou outra condição.</div></div>';
  o+='<div class="card"><b>Metas diárias</b><div class="mu">Água por dia (litros)</div><div class="row"><input id="cw" inputmode="decimal" value="'+(c.waterMl/1000)+'"></div><div class="mu">Passos · kcal · proteína g (0 = sem meta)</div><div class="row"><input id="cs" inputmode="numeric" value="'+c.steps+'"><input id="ck" inputmode="numeric" value="'+c.kcal+'"><input id="cp" inputmode="numeric" value="'+c.prot+'"></div><button class="btn" onclick="saveCfg()">Guardar metas</button></div>';
  var w=byd(S.w),l=w.length?w[w.length-1].kg:null;
  o+='<div class="card"><b>Meta de peso</b><div class="row"><input id="goal" inputmode="decimal" placeholder="kg" value="'+(S.goal||'')+'"><button class="btn" onclick="setGoal()">Definir</button></div>';
  if(S.goal&&l&&w.length){var st=w[0].kg,tot=Math.abs(st-S.goal)||1,done=Math.min(100,Math.max(0,Math.abs(st-l)/tot*100));o+='<div class="bar"><i style="width:'+done.toFixed(0)+'%"></i></div><div class="mu">Faltam '+Math.abs(l-S.goal).toFixed(1)+' kg para '+S.goal+' kg ('+done.toFixed(0)+'%)</div>'}
  o+=idealHelp(l);
  o+='</div><div class="card"><b>Dados</b><div class="mu">Guarda uma cópia ou restaura de um ficheiro.</div><div class="row"><button class="btn" onclick="exportar()">Exportar</button><input type="file" accept=".json,application/json" onchange="importar(this)"></div><div class="row"><button class="btn2" style="flex:1" onclick="rpShow()">📄 Relatório para consultas</button></div><div class="row"><button class="btn2" style="flex:1" onclick="obShow()">🧭 Refazer a configuração inicial</button></div><div class="row"><button class="btn2" style="flex:1" onclick="driveOff()">☁️ Desligar da Google Drive</button></div><div style="text-align:center;margin-top:6px"><a href="privacidade.html" target="_blank" class="mu">Política de privacidade</a></div></div>';
  return o}
var MN=['Cintura','Abdómen','Anca'],MC=['#e8590c','#1971c2','#7048e8'];
var TB=[['🏠','Hoje'],['🍽️','Comida'],['⚖️','Corpo'],['🏆','Progresso'],['⚙️','Mais']];
function nav(){$('nav').innerHTML=TB.map(function(t,i){return '<button class="'+(i==tab?'on':'')+'" onclick="tab='+i+';draw()">'+t[0]+'<small>'+t[1]+'</small></button>'}).join('')}
function draw(){
  var C=calc(),h=HS[S.cfg.house]||HS.fenix,st=document.documentElement.style;
  var th=S.cfg.theme||'light',rt=document.documentElement,dk=th=='dark'||(th=='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  if(rt.setAttribute){if(th=='auto')rt.removeAttribute('data-theme');else rt.setAttribute('data-theme',th)}
  st.setProperty('--ac',h[2]);st.setProperty('--ac2',h[3]);st.setProperty('--tint',tint(h[2],dk?0.24:0.18));
  nav();
  var showD=tab<3||(tab==4&&sub<2);
  $('v').innerHTML=(showD?dnav():'')+[vHome,vComida,vPeso,vPremios,vMais][tab](C);
  var dq=dayData(cur);lastN[cur]=dq.n;lastQ[cur]=flagsOf(dq);
  var sg2=stage(C.lv);
  if(S.pet.seen<0)S.pet.seen=sg2;else if(sg2>S.pet.seen){S.pet.seen=sg2;store();showEvo(sg2)}
  if(pendingCheer){var pc=pendingCheer;pendingCheer=null;if(tab==0)happyHop(pc)}
  if(tab==2)phRender()}

/* ---- Google Drive (pasta privada da app) ---- */
var CLIENT_ID=window.CP_CLIENT_ID||'';
var SCOPE='https://www.googleapis.com/auth/drive.appdata',FN='controlo-peso.json';
var tok=null,tokExp=0,tc=null,fid=null,timer=null,busy=false;
function stat(t){var e=$('st');if(e)e.textContent=t}
function getTok(){return new Promise(function(res,rej){
  if(!window.google||!google.accounts)return rej(new Error('biblioteca Google não carregou (sem ligação?)'));
  if(!CLIENT_ID||CLIENT_ID.indexOf('COLOCA')==0)return rej(new Error('falta configurar o CLIENT_ID'));
  if(!tc)tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
    callback:function(r){if(r.error)return tc._rej(new Error(r.error));tok=r.access_token;tokExp=Date.now()+r.expires_in*1000;try{localStorage.setItem('cp_drive','1')}catch(e){}tc._res(tok)},
    error_callback:function(e){tc._rej(new Error(e.type||'login cancelado'))}});
  tc._res=res;tc._rej=rej;tc.requestAccessToken({prompt:''});
})}
function api(url,o){o=o||{};o.headers=Object.assign({Authorization:'Bearer '+tok},o.headers||{});
  return fetch(url,o).then(function(r){if(!r.ok)throw new Error('Drive '+r.status);return r})}
function findF(){if(fid)return Promise.resolve(fid);
  return api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='"+FN+"'"))
    .then(function(r){return r.json()}).then(function(j){fid=j.files&&j.files[0]?j.files[0].id:null;return fid})}
function push(){var body=JSON.stringify(S);
  if(fid)return api('https://www.googleapis.com/upload/drive/v3/files/'+fid+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:body});
  var b='cpb',meta=JSON.stringify({name:FN,parents:['appDataFolder']});
  return api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},
    body:'--'+b+'\r\nContent-Type: application/json\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--'})
    .then(function(r){return r.json()}).then(function(j){fid=j.id})}
function hasData(o){return !!(o&&((o.w&&o.w.length)||(o.meals&&o.meals.length)||(o.water&&Object.keys(o.water).length)))}
function remember(){try{localStorage.setItem('cp_fid',fid||'')}catch(e){}}
function sync(interactive){
  if(busy)return;busy=true;stat('A sincronizar…');
  var ok=tok&&Date.now()<tokExp-60000,known=null;try{known=localStorage.getItem('cp_fid')}catch(e){}
  (ok?Promise.resolve(tok):(interactive?getTok():Promise.reject(new Error('sem sessão'))))
  .then(findF).then(function(){
    var hasLocal=hasData(S);
    if(!fid){
      if(known&&hasLocal&&!confirm('Parece que entraste com outra conta Google. Queres copiar os dados deste telemóvel para ela?'))throw new Error('cancelado');
      return push().then(remember)}
    return api('https://www.googleapis.com/drive/v3/files/'+fid+'?alt=media').then(function(r){return r.json()}).then(function(R){
      var other=known&&known!==fid,first=!known;
      if(hasLocal&&hasData(R)&&(other||first)){
        if(confirm('Esta conta Google já tem dados guardados.\n\nOK = usar os dados da Drive (substitui os deste telemóvel).\nCancelar = manter os deste telemóvel (substitui os da Drive).')){load(R);store();lastXp=calc().xp;draw()}
        else return push().then(remember);
      }else if((R.t||0)>(S.t||0)){load(R);store();lastXp=calc().xp;draw()}
      else if((R.t||0)<(S.t||0))return push();
      remember()})})
  .then(function(){stat('Sincronizado às '+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}));var b=$('sb');if(b)b.textContent='Sincronizar'})
  .catch(function(e){stat('Sem sincronização: '+e.message)})
  .then(function(){busy=false})}
function driveOff(){
  try{if(tok&&window.google&&google.accounts)google.accounts.oauth2.revoke(tok,function(){})}catch(e){}
  tok=null;tokExp=0;fid=null;tc=null;
  try{localStorage.removeItem('cp_drive');localStorage.removeItem('cp_fid')}catch(e){}
  stat('Dados só neste telemóvel');var b=$('sb');if(b)b.textContent='Ligar ao Google Drive';
  toast('Drive desligada. Os dados continuam neste telemóvel.')}
try{if(localStorage.getItem('cp_drive')){$('sb').textContent='Sincronizar';stat('Toca em Sincronizar para atualizar')}else stat('Dados só neste telemóvel')}catch(e){stat('Dados só neste telemóvel')}
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
lastXp=calc().xp;
draw();
if(!S.ob){if(S.w.length||Object.keys(S.water).length||S.meals.length)S.ob=1;else obShow()}
</script>
